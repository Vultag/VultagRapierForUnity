[package]
name = "rapier_unity"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
rapier2d = { version = "0.33.0", features = ["serde-serialize"] }
glam = "0.33.2"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"